<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QC Dashboard - Рейтинг</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <button id="theme-toggle" onclick="toggleTheme()" title="Тема">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <div id="sidebar" class="transition-all duration-300"></div>

  <div id="main" class="transition-all duration-300">
    <div style="background: rgba(249, 115, 22, 0.15); backdrop-filter: blur(8px); padding: 12px 28px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(249, 115, 22, 0.3);">
      <div style="font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 12px; color: #f1f5f9;">
        <span style="background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; box-shadow: 0 2px 4px rgba(234, 88, 12, 0.4);">NEW v1.2.3</span>
        Сводный и периодический рейтинг
      </div>
    </div>
    
    <div class="section active" style="padding:24px;">
      <div class="page-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg> Рейтинг сотрудников</div>
      <div class="page-sub" style="margin-bottom:24px">Топ 5 операторов и рейтинг требующих внимания</div>
      
      <div style="background:rgba(30,36,53,0.4);padding:15px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);margin-bottom:24px;display:flex;align-items:center;gap:15px;flex-wrap:wrap;">
        <span style="font-size:11px;font-weight:700;color:#a78bfa;">МЕСЯЦ:</span>
        <select id="monthSelect" style="background:#0f172a;color:white;border:1px solid #334155;padding:6px 12px;border-radius:6px;font-size:12px;outline:none;cursor:pointer;min-width:120px;"></select>
        <span style="font-size:11px;font-weight:700;color:#a78bfa;margin-left:12px;">ПЕРИОД:</span>
        <select id="periodSelect" style="background:#0f172a;color:white;border:1px solid #334155;padding:6px 12px;border-radius:6px;font-size:12px;outline:none;cursor:pointer;min-width:140px;"></select>
      </div>
      
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;">
          <div class="card" style="padding:16px;">
             <div class="card-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:5px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg> Топ 5 операторов (Сводка)</div>
             <div style="position:relative;height:250px;width:100%;"><canvas id="topChart"></canvas></div>
          </div>
          <div class="card" style="padding:16px;">
             <div class="card-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:5px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg> Требуют внимания (Bottom 3)</div>
             <div style="position:relative;height:250px;width:100%;"><canvas id="bottomChart"></canvas></div>
          </div>
      </div>

      <div class="card" style="margin-top:20px;">
        <div class="card-title">Полный Leaderboard</div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th style="min-width:40px;">#</th>
                <th>ОПЕРАТОР SC</th>
                <th style="min-width:80px;">тек.TQS</th>
                <th style="min-width:70px;">Δ TQS</th>
                <th style="min-width:80px;">TQS период</th>
                <th style="min-width:70px;">Динамика периода</th>
                <th style="min-width:80px;">Средний TQS</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSidebar('rating');
      initTheme();
    });
  </script>
</body>
</html>
