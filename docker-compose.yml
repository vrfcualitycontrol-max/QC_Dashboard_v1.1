version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:16-alpine
    container_name: qc_postgres
    environment:
      POSTGRES_USER: qc_user
      POSTGRES_PASSWORD: qc_password
      POSTGRES_DB: qc_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc_user -d qc_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qc_network

  # FastAPI backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qc_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://qc_user:qc_password@postgres:5432/qc_dashboard
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./reports:/app/reports
      - ../index.html:/app/index.html
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qc_network
    restart: unless-stopped
    # Инициализация БД после создания таблиц
    command: >
      sh -c "python init_db.py && uvicorn app:app --host 0.0.0.0 --port 8000 --reload"

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: qc_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ..:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - qc_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  qc_network:
    driver: bridge
