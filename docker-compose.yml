services:
  postgres:
    image: postgres:16-alpine
    container_name: qc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-qc_dashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qc_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qc_user} -d ${POSTGRES_DB:-qc_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ${BACKEND_CONTEXT:-./backend}
      dockerfile: Dockerfile
    container_name: qc_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://qc_user:change_me@postgres:5432/qc_dashboard}
      REPORTS_DIR: /app/reports
      DATA_MODE: ${DATA_MODE:-api}
    volumes:
      - type: bind
        source: ${BACKEND_SOURCE:-./backend}
        target: /app
      - type: bind
        source: ${REPORTS_SOURCE:-./reports}
        target: /app/reports
    ports:
      - "8000:8000"
    networks:
      - qc_network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qc_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - qc_network

volumes:
  postgres_data:

networks:
  qc_network:
    driver: bridge