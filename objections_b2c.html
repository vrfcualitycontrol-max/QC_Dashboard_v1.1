<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QC Dashboard - obj_b2c</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <button id="theme-toggle" onclick="toggleTheme()" title="Тема">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <div id="sidebar" class="transition-all duration-300"></div>

  <div id="main" class="transition-all duration-300">
    
    
    <div class="section active" style="padding:20px;">
            <div id="section-objections">
      <div class="page-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="6"></circle>
          <circle cx="12" cy="12" r="2"></circle>
        </svg> База возражений (B2C)</div>
      <div class="page-sub">Интерактивный поиск · Скриптовая база B2C · СВП B2C · Правовая база</div>
      <div style="position:relative; margin-bottom: 20px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; top:12px; left:14px; color:#94a3b8;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input class="search-box" id="objSearch" placeholder="Введите ключевое слово..." style="padding-left: 40px; margin-bottom: 0;" oninput="filterObj()">
      </div>
      <div class="cat-tabs" id="catTabs"></div>
      <div class="obj-count" id="objCount"></div>
      <div id="objList"></div>
      <div class="card" style="margin-top:28px;">
        <div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            style="vertical-align:middle;margin-right:4px;">
            <path
              d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2z">
            </path>
            <path
              d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2z">
            </path>
          </svg> Структура ведения переговоров (СВП) — интерактивная карта</div>
        <div style="font-size:11px;color:#64748b;margin-bottom:12px;">Нажмите на этап для раскрытия деталей</div>
        <div class="svp-container" id="svpContainer"></div>
      </div>
      <div class="card" style="margin-top:20px;">
        <div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            style="vertical-align:middle;margin-right:4px;">
            <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path>
            <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path>
            <path d="M7 21h10"></path>
            <path d="M12 3v18"></path>
            <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"></path>
          </svg> Правовой тулбокс — статьи ГК РУз</div>
        <div class="law-grid" id="lawGrid"></div>
      </div>
    </div>

    </div>
  </div>
  
  <div class="law-modal" id="lawModal" onclick="if(event.target===this)closeLawModal()">
    <div class="law-modal-box">
      <button class="law-modal-close" onclick="closeLawModal()">×</button>
      <div id="lawModalContent"></div>
    </div>
  </div>

  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSidebar('obj_b2c');
      initTheme();
      setTimeout(() => setObjMode('B2C'), 100);
    });
  </script>
</body>
</html>
