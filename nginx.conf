server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic Auth on the whole site (dashboard shows real employee performance
    # data, so it must not be reachable by anyone who just finds the IP).
    # Credentials live in .htpasswd (git-ignored) — see .htpasswd.example
    # and RUNBOOK.md "Доступ и пароли" for how to generate it.
    auth_basic "QC Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass [http://127.0.0.1:8000](http://127.0.0.1:8000);
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /index.html;
}

