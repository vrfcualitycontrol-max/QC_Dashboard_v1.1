name: Quality and Security

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality-security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest==9.0.3 bandit==1.9.4

      - name: Python syntax check
        run: |
          python -m compileall backend/app.py auto_updater.py

      - name: Backend smoke tests
        run: |
          pytest -q tests/test_backend_smoke.py

      - name: Security scan (Bandit)
        run: |
          bandit -q -r backend

      - name: Frontend security baseline check
        run: |
          python scripts/check_frontend_security.py

      - name: Docker compose validation
        run: |
          docker compose config > /dev/null
